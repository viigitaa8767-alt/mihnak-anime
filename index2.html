<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0F0B1A">
  <title>محنك الأنمي</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/kingdoms.css">
</head>
<body>
  <div id="app">

    <!-- شاشة التحميل -->
    <section id="screen-loading" class="screen active">
      <img src="assets/icon.png" alt="محنك الأنمي" class="logo">
      <h1 class="game-title">محنك الأنمي</h1>
      <p class="tagline">هل أنت محنك كفاية؟</p>
      <div class="loader"></div>
    </section>

    <!-- شاشة البداية -->
    <section id="screen-home" class="screen">
      <h1 class="game-title">محنك الأنمي</h1>
      <p class="tagline">اختبر معرفتك بالأنمي</p>
      <div class="home-buttons">
        <button id="btn-start" class="btn btn-primary">ابدأ اللعب</button>
        <button id="btn-continue" class="btn btn-secondary" hidden>متابعة</button>
        <button id="btn-reset" class="btn btn-danger">حذف البيانات</button>
      </div>
    </section>

    <!-- شاشة الممالك -->
    <section id="screen-kingdoms" class="screen">
      <header class="top-bar">
        <button class="btn-back" data-back="screen-home">←</button>
        <h2>الممالك</h2>
        <span id="score-display" class="score">0</span>
      </header>
      <div id="kingdoms-list" class="kingdoms-grid"></div>
    </section>

    <!-- شاشة الأقاليم -->
    <section id="screen-provinces" class="screen">
      <header class="top-bar">
        <button class="btn-back" data-back="screen-kingdoms">←</button>
        <h2 id="province-title">المملكة</h2>
        <span id="kingdom-score" class="score">0</span>
      </header>
      <div id="provinces-list" class="provinces-list"></div>
    </section>

    <!-- شاشة المراحل -->
    <section id="screen-levels" class="screen">
      <header class="top-bar">
        <button class="btn-back" data-back="screen-provinces">←</button>
        <h2 id="level-title">الإقليم</h2>
      </header>
      <div id="levels-list" class="levels-list"></div>
    </section>

    <!-- شاشة السؤال -->
    <section id="screen-quiz" class="screen">
      <header class="top-bar">
        <button class="btn-back" data-back="screen-levels">←</button>
        <div class="quiz-progress">
          <span id="q-counter">1/5</span>
          <div class="progress-bar"><div id="q-progress" class="progress-fill"></div></div>
        </div>
        <span id="quiz-score" class="score">0</span>
      </header>
      <div id="question-area" class="question-area"></div>
      <div id="answers-area" class="answers-area"></div>
    </section>

    <!-- شاشة النتيجة -->
    <section id="screen-result" class="screen">
      <h2 id="result-title">النتيجة</h2>
      <div id="result-content" class="result-content"></div>
      <button id="btn-next" class="btn btn-primary">التالي</button>
    </section>

    <!-- شاشة الفوز النهائي -->
    <section id="screen-victory" class="screen">
      <h1 class="victory-title">🎉 تهانينا! 🎉</h1>
      <p class="victory-text">حصلت على كرات التنين السبع!</p>
      <div class="dragon-balls">
        <span>🟠</span><span>🟠</span><span>🟠</span><span>🟠</span>
        <span>🟠</span><span>🟠</span><span>🟠</span>
      </div>
      <button id="btn-exit" class="btn btn-primary">خروج من اللعبة</button>
      <button id="btn-wipe" class="btn btn-danger">حذف البيانات وإعادة اللعب</button>
    </section>

  </div>

  <!-- السكربتات -->
  <script src="js/audio.js"></script>
  <script src="js/state.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="data/kingdom1.js"></script>
  <script src="data/kingdom2.js"></script>
  <script src="data/kingdom3.js"></script>
  <script src="data/kingdom4.js"></script>
  <script src="data/kingdom5.js"></script>
  <script src="data/kingdom6.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
